 */


plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}


dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.1'

    // This dependency is used by the application.
    implementation 'com.google.guava:guava:31.1-jre'

    // https://mvnrepository.com/artifact/com.toedter/jcalendar
    implementation group: 'com.toedter', name: 'jcalendar', version: '1.1.4'
    implementation group: 'com.kenai.nbpwr', name: 'org-jdesktop-animation-timing', version: '1.0-201002281504'

    implementation files('libs/DateChooser.jar')
    implementation files('libs/jcalendar-1.4.jar')

    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    implementation 'org.json:json:20230618'
    implementation 'com.google.code.gson:gson:2.10.1'
}

application {
    // Define the main class for the application.
    mainClass = 'CleoDevelopmentver1.App'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
